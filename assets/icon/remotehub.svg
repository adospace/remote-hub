<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <path id="tile" d="M 350.06 0 L 673.94 0 C 774.74 0 825.14 0 870.59 15.0 C 938.62 38.71 985.29 85.38 1009.0 153.41 C 1024 198.86 1024 249.26 1024 350.06 L 1024 673.94 C 1024 774.74 1024 825.14 1009.0 870.59 C 985.29 938.62 938.62 985.29 870.59 1009.0 C 825.14 1024 774.74 1024 673.94 1024 L 350.06 1024 C 249.26 1024 198.86 1024 153.41 1009.0 C 85.38 985.29 38.71 938.62 15.0 870.59 C 0 825.14 0 774.74 0 673.94 L 0 350.06 C 0 249.26 0 198.86 15.0 153.41 C 38.71 85.38 85.38 38.71 153.41 15.0 C 198.86 0 249.26 0 350.06 0 Z"/>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F5FE8"/>
      <stop offset="0.5" stop-color="#1288D8"/>
      <stop offset="1" stop-color="#0AC2C1"/>
    </linearGradient>
    <radialGradient id="glow" cx="280" cy="200" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vign" x1="512" y1="560" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#083B78" stop-opacity="0"/>
      <stop offset="1" stop-color="#083B78" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="clip"><use href="#tile"/></clipPath>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#083B66" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <use href="#tile" fill="url(#bg)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glow)"/>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#vign)"/>
  </g>

  <g filter="url(#ds)">
    <!-- screen glass -->
    <rect x="304" y="308" width="416" height="296" rx="12" fill="#FFFFFF" opacity="0.12"/>
    <!-- monitor bezel -->
    <rect x="272" y="276" width="480" height="360" rx="44" fill="none" stroke="#FFFFFF" stroke-width="64"/>
    <!-- stand -->
    <rect x="480" y="660" width="64" height="48" fill="#FFFFFF"/>
    <rect x="386" y="700" width="252" height="46" rx="23" fill="#FFFFFF"/>
    <!-- hub-and-spoke motif: 1 central node + 3 outer nodes -->
    <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round">
      <line x1="512" y1="456" x2="512" y2="356"/>
      <line x1="512" y1="456" x2="422" y2="516"/>
      <line x1="512" y1="456" x2="602" y2="516"/>
    </g>
    <circle cx="512" cy="356" r="40" fill="#FFFFFF"/>
    <circle cx="422" cy="516" r="40" fill="#FFFFFF"/>
    <circle cx="602" cy="516" r="40" fill="#FFFFFF"/>
    <circle cx="512" cy="456" r="56" fill="#FFFFFF"/>
  </g>
